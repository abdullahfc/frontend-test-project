name: Deploy to CyberPanel

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: sudo apt-get update && sudo apt-get install sshpass rsync -y

      - name: Copy files to Server using Rsync
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        # Rsync is much smarter than scp and handles server welcome messages better
        run: |
          sshpass -e rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/home/test-frontend.local/public_html/
