name: Deploy to CyberPanel

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      # This installs a standard Linux tool to handle password logins securely
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install sshpass -y

      # This uses the native secure copy (scp) command to bypass the CyberPanel welcome message
      - name: Copy files to Server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -r ./* ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/home/test-frontend.local/public_html/
